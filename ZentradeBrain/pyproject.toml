[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zentrade-brain"
version = "0.1.0"
description = "ZenTrade Brain: paper-trading research system for NSE equities"
requires-python = ">=3.13"
dependencies = [
    "polars>=1.44",
    "pyarrow>=25.0",
    "duckdb>=1.5",
    "pydantic>=2.13",
]

[project.optional-dependencies]
dev = ["pytest>=9.0"]

[project.scripts]
zentrade-backfill = "zentrade.adapters.data.backfill:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
